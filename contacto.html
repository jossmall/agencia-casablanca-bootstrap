          <img class="logo" src="./logo/Logo.svg" alt="Logotipo de la Agencia Inmobiliaria Casablanca">
        </a>   
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Mostrar menú">
      <span class="navbar-toggler-icon"></span>
      </button>    
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="venta.html">Venta</a>

          <li class="nav-item">
            <a class="nav-link" href="conocenos.html">Conócenos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a>
          </li>
        </ul>      
        <div class="d-flex gap-2 mx-auto">
          <a class="nav-link" href="index.html">ES</a>
          <span class="nav-link">EN</span>
        </div>
      </div>
      </div>
    </nav>

  </header>

  <main>

    <div class="container my-5">
    <div class="row justify-content-center g-4">
      <div class="col-12 col-md-8">
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Nombre y apellidos</label>
            <input type="text" class="form-control" id="name">            
          </div>
  
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email">
          </div>

          <div class="mb-3 form-floating">
              <textarea class="form-control" placeholder="Escribe tu mensaje" id="floatingTextarea2" style="height: 100px"></textarea>
              <label for="floatingTextarea2">Comentarios</label>
          </div>

          <div class="mb-3">
            <label for="ref" class="form-label">Referencia de vivienda</label>
            <input type="text" class="form-control" id="ref">
          </div>
  
          <button type="submit" class="btn btn-outline-dark">Enviar</button>
          
        </form>
      </div>

      <div class="col-12 col-lg-6 d-flex justify-content-center">
        <img src="./images/mapForm.png" class="mapForm img-thumbnail" alt="Mapa con la ubicación de la agencia">
      </div>
    </div>
    </div>

  </main>

  <footer class="bg-body-tertiary border-top py-4">

    <div class="container">
      <div class="row g-5">
        <div class="col-12 col-md-3 text-center">
          <h6>¿Dónde estamos?</h6>
          <img src="./images/ubi.png" alt="Mapa con la ubicación de la agencia" class="map img-thumbnail">
        </div>

        <div class="col-12 col-md-3 text-center">
          <h6>Síguenos</h6>
          <div class="d-flex justify-content-center">
            <img class="social" src="./images/logoIG.png" alt="Instagram">
            <img class="social" src="./images/logoFB.png" alt="Facebook">
            <img class="social" src="./images/logoX.png" alt="X">
            <img class="social" src="./images/logoWA.png" alt="WhatsApp">
          </div>
        </div>

        <div class="col-12 col-md-3 text-center">
          <h6>Información de contacto</h6>
          <ul class="list-unstyled">
            <li>Inmobiliaria Casablanca</li>
            <li>Valencia</li>
            <li>Tel: 600 000 000</li>
            <li>Email: info@casablanca.com</li>
          </ul>
        </div>

        <div class="col-12 col-md-3 text-center">
          
          <a href="index.html">
            <img class="logo" src="./logo/Logo.svg" alt="Logo de Agencia Casablanca">

          </ul>
        </div>

        <div class="d-flex justify-content-center small">
          <span>&copy; 2026 Agencia Casablanca</span>          
        </div>

      </div>
